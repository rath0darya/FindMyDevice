name: Android Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'Downloads/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk

      - name: Update repository Downloads folder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p Downloads
          cp app/build/outputs/apk/debug/app-debug.apk Downloads/FindMyDevice-debug.apk
          test -s Downloads/FindMyDevice-debug.apk

      - name: Commit APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Downloads/FindMyDevice-debug.apk
          if git diff --cached --quiet; then
            echo 'APK is already up to date.'
          else
            git commit -m 'ci: update downloadable APK'
            git push
          fi
