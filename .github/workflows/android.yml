name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Prepare Downloads folder
        run: |
          mkdir -p Downloads
          cp app/build/outputs/apk/debug/app-debug.apk Downloads/FindMyDevice-debug.apk
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FindMyDevice-Downloads
          path: Downloads/
          if-no-files-found: error
          retention-days: 14
